<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Дом рядом</title>

    <style>
        :root {
            --background: #071513;
            --panel: rgba(18, 43, 39, 0.82);
            --panel-light: rgba(25, 58, 52, 0.72);
            --border: rgba(121, 225, 203, 0.15);
            --text: #f3fffc;
            --muted: #8eaaa4;
            --green: #42d9bd;
            --green-dark: #19a992;
            --orange: #ff9e55;
            --danger: #ff7b7b;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--background);
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px 48px;
            background:
                radial-gradient(
                    circle at 15% 0%,
                    rgba(39, 196, 166, 0.19),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 100% 35%,
                    rgba(255, 158, 85, 0.09),
                    transparent 25%
                ),
                var(--background);
            color: var(--text);
            font-family:
                Inter, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
        }

        button,
        select,
        textarea {
            font: inherit;
        }

        .app {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 42px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            display: grid;
            width: 46px;
            height: 46px;
            place-items: center;
            border: 1px solid rgba(72, 225, 195, 0.28);
            border-radius: 15px;
            background:
                linear-gradient(
                    145deg,
                    rgba(65, 218, 188, 0.21),
                    rgba(22, 65, 57, 0.25)
                );
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 12px 30px rgba(0, 0, 0, 0.24);
        }

        .brand-icon svg {
            width: 27px;
            height: 27px;
        }

        .brand-name {
            margin: 0;
            font-size: 17px;
            font-weight: 750;
            letter-spacing: -0.02em;
        }

        .brand-caption {
            margin: 2px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        .admin-link {
            padding: 9px 13px;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
            transition: 160ms ease;
        }

        .admin-link:hover {
            border-color: rgba(66, 217, 189, 0.4);
            color: var(--text);
        }

        .hero {
            margin-bottom: 26px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 15px;
            color: var(--green);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 14px var(--green);
            content: "";
        }

        h1 {
            max-width: 480px;
            margin: 0;
            font-size: clamp(38px, 9vw, 58px);
            line-height: 0.98;
            letter-spacing: -0.055em;
        }

        .hero-text {
            max-width: 440px;
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.55;
        }

        .panel {
            position: relative;
            overflow: hidden;
            padding: 22px;
            border: 1px solid var(--border);
            border-radius: 25px;
            background:
                linear-gradient(
                    145deg,
                    rgba(25, 59, 53, 0.93),
                    rgba(11, 31, 27, 0.91)
                );
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.055),
                0 28px 80px rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(18px);
        }

        .panel::before {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(59, 214, 184, 0.08);
            filter: blur(10px);
            content: "";
            pointer-events: none;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .step-number {
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            border-radius: 11px;
            background: rgba(66, 217, 189, 0.13);
            color: var(--green);
            font-size: 13px;
            font-weight: 800;
        }

        .step-title {
            margin: 0;
            font-size: 17px;
            font-weight: 700;
        }

        .field {
            margin-top: 18px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #c8dbd7;
            font-size: 13px;
            font-weight: 650;
        }

        select,
        textarea {
            display: block;
            width: 100%;
            border: 1px solid rgba(138, 201, 188, 0.16);
            outline: none;
            border-radius: 15px;
            background: rgba(4, 20, 17, 0.7);
            color: var(--text);
            transition:
                border-color 160ms ease,
                box-shadow 160ms ease,
                background 160ms ease;
        }

        select {
            min-height: 52px;
            padding: 0 42px 0 15px;
            cursor: pointer;
        }

        textarea {
            min-height: 125px;
            padding: 15px;
            line-height: 1.5;
            resize: vertical;
        }

        select:focus,
        textarea:focus {
            border-color: rgba(66, 217, 189, 0.58);
            background: rgba(4, 20, 17, 0.9);
            box-shadow: 0 0 0 4px rgba(66, 217, 189, 0.08);
        }

        textarea::placeholder {
            color: #58716c;
        }

        option {
            background: #102b26;
            color: var(--text);
        }

        .primary-button,
        .secondary-button {
            display: flex;
            width: 100%;
            min-height: 54px;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            font-weight: 750;
            cursor: pointer;
            transition:
                transform 160ms ease,
                opacity 160ms ease,
                border-color 160ms ease;
        }

        .primary-button {
            margin-top: 22px;
            border: 0;
            background:
                linear-gradient(135deg, var(--green), var(--green-dark));
            color: #03231d;
            box-shadow: 0 14px 30px rgba(29, 180, 153, 0.2);
        }

        .secondary-button {
            margin-top: 10px;
            border: 1px solid rgba(112, 209, 190, 0.22);
            background: rgba(29, 72, 64, 0.48);
            color: var(--text);
        }

        .primary-button:hover,
        .secondary-button:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: default;
            opacity: 0.58;
            transform: none;
        }

        #result {
            display: grid;
            gap: 11px;
            margin-top: 18px;
        }

        #result:empty {
            display: none;
        }

        .result-card {
            padding: 17px;
            border: 1px solid var(--border);
            border-radius: 17px;
            background: var(--panel-light);
        }

        .result-label {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.045em;
            text-transform: uppercase;
        }

        .result-value {
            margin: 0;
            color: var(--text);
            font-size: 15px;
            line-height: 1.5;
        }

        .result-card.highlight {
            border-color: rgba(255, 158, 85, 0.27);
            background:
                linear-gradient(
                    135deg,
                    rgba(255, 158, 85, 0.11),
                    rgba(24, 56, 50, 0.72)
                );
        }

        .success-message,
        .error-message,
        .loading-message {
            margin: 0;
            padding: 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.45;
        }

        .success-message {
            border: 1px solid rgba(66, 217, 189, 0.26);
            background: rgba(66, 217, 189, 0.1);
            color: #adf9e9;
        }

        .error-message {
            border: 1px solid rgba(255, 123, 123, 0.24);
            background: rgba(255, 123, 123, 0.09);
            color: #ffc2c2;
        }

        .loading-message {
            color: var(--muted);
            text-align: center;
        }

        footer {
            margin-top: 24px;
            color: #58716c;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding-top: 18px;
            }

            .topbar {
                margin-bottom: 34px;
            }

            .admin-link {
                padding: 8px 10px;
                font-size: 12px;
            }

            .panel {
                padding: 18px;
                border-radius: 21px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <div class="brand-icon">
                    <svg
                        viewBox="0 0 32 32"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            d="M5 15.3L16 6L27 15.3V26H19.7V19.2H12.3V26H5V15.3Z"
                            stroke="#48DFC3"
                            stroke-width="2.4"
                            stroke-linejoin="round"
                        />
                        <path
                            d="M21.8 9.1V5.8H25.4V12.1"
                            stroke="#FF9E55"
                            stroke-width="2.4"
                            stroke-linejoin="round"
                        />
                    </svg>
                </div>

                <div>
                    <p class="brand-name">Дом рядом</p>
                    <p class="brand-caption">Помощь у порога</p>
                </div>
            </div>

            <a class="admin-link" href="/admin">Заявки</a>
        </header>

        <main>
            <section class="hero">
                <p class="eyebrow">Городской помощник</p>

                <h1>Решение бытовых проблем рядом</h1>

                <p class="hero-text">
                    Опишите ситуацию — сервис подскажет,
                    кто отвечает за проблему и что делать дальше.
                </p>
            </section>

            <section class="panel">
                <div class="step">
                    <span class="step-number">01</span>

                    <p class="step-title">Расскажите о проблеме</p>
                </div>

                <form id="request-form">
                    <div class="field">
                        <label for="building">Ваш дом</label>

                        <select id="building" required>
                            <option value="">Загружаем дома...</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="category">Что произошло</label>

                        <select id="category" required>
                            <option value="">Загружаем категории...</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="description">Описание ситуации</label>

                        <textarea
                            id="description"
                            placeholder="Например: течёт труба между первым и вторым этажом"
                            maxlength="1000"
                            required
                        ></textarea>
                    </div>

                    <button
                        class="primary-button"
                        type="submit"
                        id="check"
                    >
                        Узнать, куда обратиться
                    </button>
                </form>

                <div id="result" aria-live="polite"></div>
            </section>
        </main>

        <footer>
            Демонстрационная версия использует тестовые данные домов
            и управляющих организаций.
        </footer>
    </div>

    <script>
        function createResultCard(labelText, valueText, highlight = false) {
            const card = document.createElement("div");
            card.className = highlight
                ? "result-card highlight"
                : "result-card";

            const label = document.createElement("p");
            label.className = "result-label";
            label.textContent = labelText;

            const value = document.createElement("p");
            value.className = "result-value";
            value.textContent = valueText;

            card.append(label, value);

            return card;
        }

        async function loadOptions() {
            const result = document.getElementById("result");

            try {
                const [buildingsResponse, categoriesResponse] =
                    await Promise.all([
                        fetch("/buildings"),
                        fetch("/categories")
                    ]);

                if (!buildingsResponse.ok || !categoriesResponse.ok) {
                    throw new Error("Ошибка загрузки");
                }

                const buildings = await buildingsResponse.json();
                const categories = await categoriesResponse.json();

                const buildingSelect =
                    document.getElementById("building");

                buildingSelect.replaceChildren(
                    new Option("Выберите дом", "")
                );

                for (const building of buildings) {
                    buildingSelect.add(
                        new Option(building.address, building.id)
                    );
                }

                const categorySelect =
                    document.getElementById("category");

                categorySelect.replaceChildren(
                    new Option("Выберите проблему", "")
                );

                for (const category of categories) {
                    categorySelect.add(
                        new Option(category, category)
                    );
                }
            } catch (error) {
                const message = document.createElement("p");
                message.className = "error-message";
                message.textContent =
                    "Не удалось загрузить дома и категории.";

                result.replaceChildren(message);
            }
        }

        document
            .getElementById("request-form")
            .addEventListener("submit", async function (event) {
                event.preventDefault();

                const buildingID =
                    document.getElementById("building").value;

                const category =
                    document.getElementById("category").value;

                const description =
                    document
                        .getElementById("description")
                        .value
                        .trim();

                const result = document.getElementById("result");
                const checkButton = document.getElementById("check");

                if (!buildingID || !category || !description) {
                    const message = document.createElement("p");
                    message.className = "error-message";
                    message.textContent =
                        "Выберите дом, проблему и заполните описание.";

                    result.replaceChildren(message);
                    return;
                }

                checkButton.disabled = true;
                checkButton.textContent = "Проверяем...";

                const loading = document.createElement("p");
                loading.className = "loading-message";
                loading.textContent = "Определяем ответственную службу…";
                result.replaceChildren(loading);

                try {
                    const response = await fetch("/requests/preview", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            building_id: buildingID,
                            category: category,
                            description: description
                        })
                    });

                    if (!response.ok) {
                        throw new Error("Ошибка сервера");
                    }

                    const data = await response.json();

                    const address = createResultCard(
                        "Выбранный дом",
                        data.request.address
                    );

                    const managingOrg = createResultCard(
                        "Управляющая организация",
                        data.managing_org
                    );

                    const responsible = createResultCard(
                        "Куда обратиться",
                        data.responsible,
                        true
                    );

                    const nextStep = createResultCard(
                        "Что делать дальше",
                        data.next_step
                    );

                    const copyButton =
                        document.createElement("button");

                    copyButton.type = "button";
                    copyButton.className = "secondary-button";
                    copyButton.textContent = "Скопировать обращение";

                    copyButton.addEventListener(
                        "click",
                        async function () {
                            const message =
                                "Адрес: " +
                                data.request.address +
                                "\n" +
                                "Проблема: " +
                                data.request.category +
                                "\n" +
                                "Описание: " +
                                data.request.description;

                            try {
                                await navigator.clipboard.writeText(
                                    message
                                );

                                copyButton.textContent =
                                    "Скопировано ✓";
                            } catch (error) {
                                copyButton.textContent =
                                    "Не удалось скопировать";
                            }
                        }
                    );

                    const createButton =
                        document.createElement("button");

                    createButton.type = "button";
                    createButton.className = "primary-button";
                    createButton.textContent = "Создать заявку";

                    createButton.addEventListener(
                        "click",
                        async function () {
                            createButton.disabled = true;
                            createButton.textContent =
                                "Создаём заявку...";

                            try {
                                const createResponse =
                                    await fetch("/requests", {
                                        method: "POST",
                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },
                                        body: JSON.stringify({
                                            building_id: buildingID,
                                            category: category,
                                            description: description
                                        })
                                    });

                                if (!createResponse.ok) {
                                    throw new Error("Ошибка сервера");
                                }

                                const created =
                                    await createResponse.json();

                                const success =
                                    document.createElement("p");

                                success.className =
                                    "success-message";

                                success.textContent =
                                    "Заявка " +
                                    created.id +
                                    " создана. Статус: " +
                                    created.status + ".";

                                result.append(success);

                                createButton.textContent =
                                    "Заявка создана ✓";
                            } catch (error) {
                                createButton.disabled = false;
                                createButton.textContent =
                                    "Создать заявку";

                                const message =
                                    document.createElement("p");

                                message.className = "error-message";
                                message.textContent =
                                    "Не удалось создать заявку.";

                                result.append(message);
                            }
                        }
                    );

                    result.replaceChildren(
                        address,
                        managingOrg,
                        responsible,
                        nextStep,
                        copyButton,
                        createButton
                    );
                } catch (error) {
                    const message = document.createElement("p");
                    message.className = "error-message";
                    message.textContent =
                        "Не удалось проверить обращение.";

                    result.replaceChildren(message);
                } finally {
                    checkButton.disabled = false;
                    checkButton.textContent =
                        "Узнать, куда обратиться";
                }
            });

        loadOptions();
    </script>
</body>
</html>
