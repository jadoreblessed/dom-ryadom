<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Заявки — Дом рядом</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 20px;
            background: #f3f7f6;
            color: #17342f;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0;
            color: #176b60;
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 12px;
            background: #176b60;
            color: white;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        #requests {
            display: grid;
            gap: 16px;
        }

        .request-card {
            padding: 20px;
            border: 1px solid #d7e3e0;
            border-radius: 16px;
            background: white;
        }

        .request-card h2 {
            margin: 0 0 14px;
            font-size: 20px;
            color: #176b60;
        }

        .request-card p {
            margin: 8px 0;
            line-height: 1.4;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #e1f1ed;
            color: #176b60;
            font-weight: bold;
        }

        .empty {
            padding: 24px;
            border-radius: 16px;
            background: white;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>Заявки жителей</h1>
            <p>Панель диспетчера</p>
        </div>

        <button type="button" id="refresh">Обновить</button>
    </header>

    <main id="requests">
        <p class="empty">Загружаем заявки...</p>
    </main>

    <script>
        async function loadRequests() {
            const container = document.getElementById("requests");
            container.innerHTML = '<p class="empty">Загружаем заявки...</p>';

            try {
                const response = await fetch("/requests");

                if (!response.ok) {
                    throw new Error("Ошибка сервера");
                }

                const requests = await response.json();
                container.replaceChildren();

                if (requests.length === 0) {
                    const empty = document.createElement("p");
                    empty.className = "empty";
                    empty.textContent = "Заявок пока нет.";
                    container.append(empty);
                    return;
                }

                for (const item of requests) {
                    const card = document.createElement("article");
                    card.className = "request-card";

                    const title = document.createElement("h2");
                    title.textContent = item.id;

                    const status = document.createElement("span");
                    status.className = "status";
                    status.textContent = item.status;

                    const address = document.createElement("p");
                    address.textContent = "Адрес: " + item.request.address;

                    const category = document.createElement("p");
                    category.textContent = "Проблема: " + item.request.category;

                    const description = document.createElement("p");
                    description.textContent =
                        "Описание: " + item.request.description;

                    const responsible = document.createElement("p");
                    responsible.textContent =
                        "Ответственный: " + item.responsible;

                    const createdAt = document.createElement("p");
                    createdAt.textContent =
                        "Создана: " +
                        new Date(item.created_at).toLocaleString("ru-RU");

                    card.append(
                        title,
                        status,
                        address,
                        category,
                        description,
                        responsible,
                        createdAt
                    );

                    container.append(card);
                }
            } catch (error) {
                container.innerHTML =
                    '<p class="empty">Не удалось загрузить заявки.</p>';
            }
        }

        document
            .getElementById("refresh")
            .addEventListener("click", loadRequests);

        loadRequests();
    </script>
</body>
</html>
