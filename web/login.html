<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход — Дом рядом</title>

    <!-- Стили те же, что в admin.html: страница входа не должна выглядеть
         чужеродно рядом с панелью, в которую ведёт. -->
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="login-page">
    <div class="login-mark">Д<span>Р</span></div><p class="admin-overline">ДОМ РЯДОМ / ДОСТУП ДИСПЕТЧЕРА</p><h1>Всё под контролем<span class="title-dot">.</span></h1>
    <p class="subtitle">Вход для сотрудника управляющей организации. Заявки жителей видны только после входа.</p>

    <form id="login-form">
        <div>
            <label for="login">Логин</label>
            <input id="login" name="login" autocomplete="username" autocapitalize="off"
                   spellcheck="false" required>
        </div>

        <div>
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button type="submit">Войти</button>
    </form>

    <p id="message" role="alert"></p>

    <p class="back"><a href="/app">Вернуться к подаче заявки</a></p>

    <script>
        const form = document.getElementById("login-form");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const button = form.querySelector("button");

            button.disabled = true;
            message.textContent = "";

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        login: document.getElementById("login").value,
                        password: document.getElementById("password").value
                    })
                });

                if (response.status === 401) {
                    // Один текст и на «нет такого логина», и на «неверный пароль»:
                    // подсказывать, какая именно часть неверна, не надо.
                    message.textContent = "Неверный логин или пароль.";
                    button.disabled = false;
                    document.getElementById("password").value = "";
                    return;
                }

                if (!response.ok) {
                    const data = await response.json().catch(function () {
                        return {};
                    });

                    message.textContent = data.error || "Ошибка сервера";
                    button.disabled = false;
                    return;
                }

                location.href = "/admin";
            } catch (error) {
                message.textContent = "Не удалось войти. Проверьте соединение и попробуйте ещё раз.";
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
